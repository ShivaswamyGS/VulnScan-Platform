server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path not matching a real file goes to index.html
    # so React Router's client-side routes (e.g. /reports/42) work on
    # a hard refresh, not just client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself is never
    # cached so a new deploy is picked up on the next load.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
